<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EAW Einsatzplan</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0d3b78">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EAW Plan">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding-top: env(safe-area-inset-top); box-sizing: border-box; }
  #app { display: block; width: 100%; height: 100%; border: 0; }
  .voll { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
          background: #fff; color: #0d3b78; text-align: center; padding: 24px; box-sizing: border-box; }
  .voll img { width: 132px; height: 132px; border-radius: 26px; box-shadow: 0 4px 18px rgba(13,59,120,.18); }
  .voll b { font-size: 19px; }
  .voll small { color: #5b6b80; font-size: 14px; max-width: 300px; line-height: 1.4; }
  .spin { width: 26px; height: 26px; border: 3px solid #d7e2f3; border-top-color: #0d3b78; border-radius: 50%; animation: d .9s linear infinite; }
  @keyframes d { to { transform: rotate(360deg); } }
  button { font: inherit; font-weight: 700; color: #fff; background: #0d3b78; border: 0; border-radius: 12px; padding: 13px 22px; }
  [hidden] { display: none !important; }
  #plan { position: fixed; inset: 0; overflow-y: auto; background: #f3f6fa; color: #14243a; padding: calc(env(safe-area-inset-top) + 12px) 14px 30px; box-sizing: border-box; }
  #plan h1 { font-size: 20px; margin: 4px 0; color: #0d3b78; } #plan .st { font-size: 13px; color: #5b6b80; margin-bottom: 10px; }
  #plan .tag { font-weight: 800; margin: 16px 0 6px; color: #0d3b78; } #plan .heute { background: #ffd54a; color: #3a2c00; font-size: 11px; padding: 1px 6px; border-radius: 6px; margin-left: 6px; }
  #plan .job { background: #fff; border: 1px solid #dfe6ef; border-radius: 12px; padding: 10px 12px; margin: 6px 0; }
  #plan .zt { font-weight: 800; } #plan .t { font-weight: 700; margin-top: 2px; } #plan .k { font-size: 13px; color: #5b6b80; margin-top: 2px; white-space: pre-wrap; }
  #plan .leiste { display: flex; gap: 8px; margin-top: 18px; } #plan .leiste button { flex: 1; }
  .ghost { background: #e6edf7; color: #0d3b78; }
</style>
</head>
<body>
<iframe id="app" title="EAW Einsatzplan" allow="camera; microphone; geolocation; clipboard-write; fullscreen"></iframe>

<div id="lade" class="voll">
  <img src="icon-192.png" alt="">
  <b>EAW Einsatzplan</b>
  <div class="spin"></div>
  <small id="lade-txt">Wird geladen …</small>
  <button id="lade-plan" class="ghost" hidden>📅 Meinen gespeicherten Plan schon ansehen</button>
</div>

<div id="off" class="voll" hidden>
  <img src="icon-192.png" alt="">
  <b>📶 Keine Internetverbindung</b>
  <small>Der Einsatzplan braucht Internet. Bitte WLAN oder mobile Daten prüfen.<br>Deine Eingaben sind gespeichert und gehen nicht verloren.</small>
  <button id="nochmal">Erneut versuchen</button>
  <button id="zeigplan" class="ghost" hidden>📅 Meinen gespeicherten Plan ansehen</button>
</div>
<div id="plan" hidden></div>

<script>
  /* Adresse der EAW-App bei Google (unverändert) */
  var APP_URL = "https://script.google.com/macros/s/AKfycbzUN6TteLP_DqxoJ6jON1z-CLTc_6mGArTe5qGJNW3LNHOrITIyouCJ_JFV9sDHvOLX3w/exec";
  var app = document.getElementById("app"), lade = document.getElementById("lade"), off = document.getElementById("off"), geladen = false, zeit = null;

  var planEl = document.getElementById("plan"), zp = document.getElementById("zeigplan");
  function zeige(el) { lade.hidden = el !== lade; off.hidden = el !== off; planEl.hidden = el !== planEl; if (el === off) zp.hidden = !gespeichert(); }
  /* Offline-Ansicht: die App schickt den eigenen Plan (diese + nächste Woche) hierher */
  var APP_ORIGIN_OK = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent\.com|google\.com)$/;
  function gespeichert() { try { var d = JSON.parse(localStorage.getItem("eaw-offline-plan") || "null"); return d && d.weeks ? d : null; } catch (e) { return null; } }
  window.addEventListener("message", function (e) {
    if (!APP_ORIGIN_OK.test(e.origin) || !e.data || typeof e.data !== "object") return;
    try { if (e.data.eaw === "plan" && e.data.weeks) localStorage.setItem("eaw-offline-plan", JSON.stringify({ n: e.data.n, stand: e.data.stand, weeks: e.data.weeks, at: Date.now() }));
      else if (e.data.eaw === "logout") localStorage.removeItem("eaw-offline-plan"); } catch (err) {}
  });
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function zeigePlan() {
    var d = gespeichert(); if (!d) return;
    var WT = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"], heute = new Date(), h0 = heute.getFullYear() + "-" + ("0" + (heute.getMonth() + 1)).slice(-2) + "-" + ("0" + heute.getDate()).slice(-2);
    var alle = []; Object.keys(d.weeks).sort().forEach(function (w) { (d.weeks[w] || []).forEach(function (g) { alle.push(g); }); });
    alle.sort(function (a, b) { return (a.d + (a.von || "")).localeCompare(b.d + (b.von || "")); });
    var on = navigator.onLine && !!app.src;
    var h = "<h1>📅 Mein Plan " + (on ? "(gespeichert)" : "(offline)") + "</h1><div class=\"st\">" + esc(d.n) + " · Stand " + esc(d.stand || "") + "<br>" + (on ? "Die App lädt im Hintergrund – Änderungen siehst du dort." : "Ohne Internet – Änderungen siehst du erst wieder mit Netz.") + "</div>", tag = "";
    alle.forEach(function (g) { if (g.d < h0) return;
      if (g.d !== tag) { tag = g.d; var p = g.d.split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]); h += "<div class=\"tag\">" + WT[dt.getDay()] + ", " + p[2] + "." + p[1] + "." + (g.d === h0 ? "<span class=\"heute\">HEUTE</span>" : "") + "</div>"; }
      h += "<div class=\"job\"><div class=\"zt\">" + (g.von ? esc(g.von) + "–" + esc(g.bis) : "ganztägig") + "</div><div class=\"t\">" + esc(g.t) + "</div>" + (g.o ? "<div class=\"k\">📍 " + esc(g.o) + "</div>" : "") +
        (g.mit && g.mit.length ? "<div class=\"k\">👥 " + esc(g.mit.join(", ")) + "</div>" : "") + (g.h ? "<div class=\"k\">ℹ️ " + esc(g.h) + "</div>" : "") + "</div>"; });
    if (!alle.some(function (g) { return g.d >= h0; })) h += "<div class=\"job\">Keine gespeicherten Termine ab heute.</div>";
    h += "<div class=\"leiste\"><button id=\"p-neu\"></button></div>";
    planEl.innerHTML = h; zeige(planEl); knopf();
  }
  zp.addEventListener("click", zeigePlan);
  /* Schnellstart: Während die App lädt, kann der gespeicherte Plan sofort angesehen werden */
  var lp = document.getElementById("lade-plan");
  lp.addEventListener("click", zeigePlan);
  function knopf() {
    var b = document.getElementById("p-neu"); if (!b) return;
    if (geladen) { b.textContent = "▶ Zur App"; b.disabled = false; b.onclick = function () { zeige(null); }; }
    else if (app.src && navigator.onLine) { b.textContent = "⏳ App lädt noch … (gleich fertig)"; b.disabled = true; b.onclick = null; }
    else { b.textContent = "🔄 Mit Internet neu laden"; b.disabled = false; b.onclick = starten; }
  }
  function starten() {
    if (!navigator.onLine) { zeige(off); return; }
    geladen = false; zeige(lade); lp.hidden = !gespeichert();
    document.getElementById("lade-txt").textContent = "Wird geladen …";
    app.src = APP_URL + (APP_URL.indexOf("?") < 0 ? "?" : "&") + "pwa=1";
    clearTimeout(zeit);
    zeit = setTimeout(function () { if (!geladen) document.getElementById("lade-txt").textContent = "Das dauert gerade länger … bitte kurz warten."; }, 12000);
  }
  app.addEventListener("load", function () { if (!app.src) return; geladen = true; clearTimeout(zeit);
    if (!planEl.hidden) { knopf(); var b = document.getElementById("p-neu"); if (b) b.textContent = "✓ App bereit – öffnen"; return; }
    zeige(null); });
  window.addEventListener("offline", function () { if (!geladen) zeige(off); });
  window.addEventListener("online", function () { if (!geladen) starten(); });
  document.getElementById("nochmal").addEventListener("click", starten);

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }
  starten();
</script>
</body>
</html>
